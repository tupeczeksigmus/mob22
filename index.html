<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <link rel="stylesheet" href="assets/app/index.css">
  <link rel="icon" type="image/x-icon" href="assets/app/images/ikonka.png">
  <link rel="apple-touch-icon" href="assets/app/images/ikonka.png">
  <link rel="shortcut icon" href="assets/app/images/ikonka.png">
  <title>mObywatel</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Cloudinary upload -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script>
    var myWidget = cloudinary.createUploadWidget({
      cloudName: 'dpjb34r5r',
      uploadPreset: 'xkbrtwvy',
      sources: ['local', 'camera'],
      multiple: false,
      language: 'pl',
      showPoweredBy: false
    }, function(error, result) {
      if (!error && result && result.event === 'success') {
        localStorage.setItem('userPhoto', result.info.secure_url);
        var img = document.querySelector('.upload_uploaded');
        if (img) {
          img.src = result.info.secure_url;
          img.style.display = 'block';
        }
        var grid = document.querySelector('.upload_grid');
        if (grid) grid.style.display = 'none';
      }
    });

    document.getElementById('upload_widget').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      myWidget.open();
    }, true);
  </script>
</body> 
</html>
